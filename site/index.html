<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나랑 맞는 산 찾기</title>
  <meta name="description" content="내 시간·체력·이동수단에 맞는 산과 코스를 산림청 공공데이터로 추천해요.">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app">
    <!-- 시작 -->
    <section id="intro" class="screen active">
      <p class="eyebrow">산림청 공공데이터로 찾는</p>
      <h1>나랑 맞는 산</h1>
      <p class="lead">질문 5개에 답하면<br>내 시간·체력·이동수단에 맞는 산과 코스를 골라드려요.</p>
      <button class="primary" id="start">시작하기</button>
      <p class="stats" id="stats"></p>
    </section>

    <!-- 질문 -->
    <section id="quiz" class="screen">
      <div class="progress"><div class="bar" id="bar"></div></div>
      <p class="qnum" id="qnum"></p>
      <h2 id="qtitle"></h2>
      <div class="options" id="options"></div>
      <p class="qfield" id="qfield"></p>
      <button class="ghost" id="back">← 이전</button>
    </section>

    <!-- 결과 -->
    <section id="result" class="screen">
      <img id="rphoto" class="rphoto" alt="" hidden referrerpolicy="no-referrer">
      <p class="eyebrow" id="rtype"></p>
      <h2 id="rname"></h2>
      <p class="rsub" id="rsub"></p>
      <p class="relaxed" id="relaxed" hidden></p>

      <ul class="reasons" id="rreasons"></ul>

      <div class="block">
        <h3>추천 코스</h3>
        <p id="rcourse"></p>
      </div>
      <div class="block">
        <h3>가는 길</h3>
        <p id="rtransport"></p>
      </div>
      <div class="block">
        <h3>이런 산이에요</h3>
        <p id="rdetails"></p>
      </div>
      <div class="block" id="plantBlock">
        <h3 id="plantTitle"></h3>
        <p id="rplant"></p>
      </div>
      <div class="block" id="altBlock">
        <h3>이런 산도 맞아요</h3>
        <ul id="ralts"></ul>
      </div>

      <div class="actions">
        <button class="primary" id="save">스토리 카드 저장</button>
        <button class="ghost" id="retry">다시 하기</button>
      </div>
      <p class="source">데이터: 산림청_명산등산로, 산림청_산 정보 조회(사진), 산림청_숲에 사는 식물 정보 (공공데이터포털)</p>
    </section>
  </main>

  <!-- 인스타 스토리 카드 (1080×1920, 화면 밖에서 렌더) -->
  <div id="cardWrap" aria-hidden="true">
    <div id="card">
      <div class="c-top">
        <p class="c-eyebrow">나랑 맞는 산</p>
        <p class="c-type" id="ctype"></p>
      </div>
      <div class="c-mid">
        <p class="c-name" id="cname"></p>
        <p class="c-sub" id="csub"></p>
        <ul class="c-reasons" id="creasons"></ul>
        <p class="c-course" id="ccourse"></p>
      </div>
      <div class="c-plant" id="cplant"></div>
      <p class="c-foot">산림청 공공데이터로 찾은 나의 산</p>
    </div>
  </div>

  <!-- iOS 등 저장 대체: 이미지를 길게 눌러 저장 -->
  <div id="preview" hidden>
    <div class="preview-inner">
      <p>이미지를 길게 눌러 저장하세요</p>
      <img id="previewImg" alt="결과 카드">
      <button class="ghost" id="closePreview">닫기</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="js/recommend.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
